version: 2
baseline: main
structural_migration_owner: main

# Main is the integration and release lane. Frontend and backend are the only
# active feature lanes; all other historical lanes are retired. The checker
# mirrors this manifest and requires an explicit override for structural moves.
lanes:
  main:
    owns:
      - .github/**
      - .dockerignore
      - .editorconfig
      - .gitattributes
      - .gitignore
      - settings.gradle.kts
      - build.gradle.kts
      - version.props
      - Directory.Build.props
      - gradle.properties
      - gradle/**
      - README.md
      - CONTRIBUTING.md
      - LICENSE
      - SECURITY.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - worktree-ownership.yml
      - examples/**
      - docs/**
      - scripts/**
      - tooling/**
      - tests/**
    structural:
      - apps/**
      - modules/**
      - contracts/**
      - platform/**
      - infra/**

  frontend:
    owns:
      - apps/**
      - modules/**

  backend:
    owns:
      - contracts/**
      - platform/**
      - infra/**
