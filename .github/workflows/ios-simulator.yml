name: iOS Simulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'apps/ios/**'
      - 'apps/mobile-shared/**'
      - 'modules/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.props'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/ios/**'
  pull_request:
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'apps/ios/**'
      - 'apps/mobile-shared/**'
      - 'modules/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.props'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/ios/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-host:
    name: Build and smoke-test iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IOS_BUILD_CONFIGURATION: ${{ github.event_name != 'pull_request' && vars.EVIDRILO_JUDGING_STAGING_ENABLED == 'true' && 'Debug' || 'Release' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode 26.0.1
        run: |
          set -Eeuo pipefail
          xcode_path=/Applications/Xcode_26.0.1.app
          if [[ ! -d "$xcode_path" ]]; then
            printf 'Required Xcode is not installed on this runner: %s\n' "$xcode_path" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"

      - name: Record Apple toolchain and simulator inventory
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/evidrilo-ios-build"
          {
            echo "runner_os=$(uname -s)"
            echo "runner_arch=$(uname -m)"
            echo "xcode_path=$(xcode-select -p)"
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee "$RUNNER_TEMP/evidrilo-ios-build/toolchain.txt"

      - name: Configure Staging judging build (Debug only)
        if: env.IOS_BUILD_CONFIGURATION == 'Debug'
        env:
          STAGING_SUPABASE_PUBLIC_KEY: ${{ secrets.EVIDRILO_STAGING_SUPABASE_PUBLIC_KEY }}
          STAGING_REVENUECAT_TEST_KEY: ${{ secrets.EVIDRILO_REVENUECAT_TEST_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          public_key = os.environ['STAGING_SUPABASE_PUBLIC_KEY']
          test_key = os.environ['STAGING_REVENUECAT_TEST_KEY']
          if not public_key.startswith('sb_publishable_') or not test_key.startswith('test_'):
              raise SystemExit('Judging build public SDK inputs are missing or invalid')
          if any(c in public_key + test_key for c in '\r\n'):
              raise SystemExit('Invalid multiline build input')
          values = {
              'SUPABASE_URL': 'https:/$()/cdgzbrrrvlrrgpzbgqog.supabase.co',
              'SUPABASE_PUBLISHABLE_KEY': public_key,
              'SUPABASE_AUTH_REDIRECT_URL': 'evidrilo:/$()/auth/callback',
              'SUPABASE_GOOGLE_AUTH_ENABLED': 'true',
              'SUPABASE_APPLE_AUTH_ENABLED': 'false',
              'EVIDRILO_API_BASE_URL': 'https:/$()/evidrilo-staging-api.onrender.com',
              'REVENUECAT_PUBLIC_SDK_KEY': test_key,
              'REVENUECAT_ENTITLEMENT_ID': 'evidrilo_pro',
              'REVENUECAT_PRODUCT_IDS': 'monthly,yearly',
          }
          Path('apps/ios/Configuration/Config.local.xcconfig').write_text(
              ''.join(f'{key}[config=Debug] = {value}\n' for key, value in values.items()))
          print('Staging public SDK inputs configured for Debug only')
          PYCONFIG

      - name: Build unsigned iOS host
        run: |
          set -Eeuo pipefail
          set -o pipefail
          xcodebuild \
            -project apps/ios/iosApp.xcodeproj \
            -scheme Evidrilo \
            -configuration "$IOS_BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/evidrilo-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/evidrilo-ios-build/xcodebuild.log" | \
            awk '/(^|[[:space:]])error:|warning:|BUILD (SUCCEEDED|FAILED)/ { print; fflush() }'

      - name: Run iOS Simulator launch smoke
        run: |
          set -Eeuo pipefail
          bash scripts/ios/smoke-simulator.sh \
            "$RUNNER_TEMP/evidrilo-derived-data/Build/Products/$IOS_BUILD_CONFIGURATION-iphonesimulator/Evidrilo.app" \
            dev.nextgen.mobile.ios \
            "$RUNNER_TEMP/evidrilo-ios-simulator-evidence"

      - name: Run iOS guest project flow UI test
        run: |
          set -Eeuo pipefail
          set -o pipefail
          simulator_udid=$(awk -F= '$1 == "simulator_udid" { print $2; exit }' \
            "$RUNNER_TEMP/evidrilo-ios-simulator-evidence/run-metadata.txt")
          if [[ -z "$simulator_udid" ]]; then
            printf '%s\n' 'The launch smoke test did not record a simulator UDID' >&2
            exit 1
          fi
          xcodebuild \
            -project apps/ios/iosApp.xcodeproj \
            -scheme Evidrilo \
            -configuration "$IOS_BUILD_CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/evidrilo-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/evidrilo-ios-build/ios-ui-tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/evidrilo-ios-build/xcodebuild-ui-tests.log" | \
            awk '/(^|[[:space:]])error:|warning:|Test Suite|Test Case|Executed [0-9]+ tests?|TEST (SUCCEEDED|FAILED)|Testing (failed|cancelled)/ { print; fflush() }'

      - name: Package verified iOS simulator application
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/evidrilo-ios-package"
          app_path="$RUNNER_TEMP/evidrilo-derived-data/Build/Products/$IOS_BUILD_CONFIGURATION-iphonesimulator/Evidrilo.app"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          ditto -c -k --keepParent "$app_path" "$RUNNER_TEMP/evidrilo-ios-package/Evidrilo-$app_version-ios-simulator.zip"
          printf '%s\n' 'iOS Simulator application; not an iPhone IPA. Debug judging builds use Staging and RevenueCat Test Store only.' > "$RUNNER_TEMP/evidrilo-ios-package/BUILD-NOTES.txt"

      - name: Upload verified iOS simulator application
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/evidrilo-ios-package
          if-no-files-found: error
          retention-days: 30

      - name: Collect final simulator diagnostics
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/evidrilo-ios-simulator-evidence"
          xcrun simctl list devices > "$RUNNER_TEMP/evidrilo-ios-simulator-evidence/devices-final-ci.txt" 2>&1
          xcodebuild -version > "$RUNNER_TEMP/evidrilo-ios-simulator-evidence/xcode-final.txt" 2>&1
          exit 0

      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: |
            ${{ runner.temp }}/evidrilo-ios-build
            ${{ runner.temp }}/evidrilo-ios-simulator-evidence
          if-no-files-found: warn
          retention-days: 7
