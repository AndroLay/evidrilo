name: Staging mobile build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_revenuecatAndroidApiKey: ${{ vars.REVENUECAT_TEST_STORE_SDK_KEY }}
      ORG_GRADLE_PROJECT_revenuecatEntitlementId: evidrilo_pro
      ORG_GRADLE_PROJECT_revenuecatProductIds: monthly,yearly
      ORG_GRADLE_PROJECT_supabaseUrl: ${{ vars.SUPABASE_URL }}
      ORG_GRADLE_PROJECT_supabasePublishableKey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_supabaseAuthRedirectUrl: evidrilo://auth/callback
      ORG_GRADLE_PROJECT_evidriloApiBaseUrl: ${{ vars.EVIDRILO_API_BASE_URL }}
      ORG_GRADLE_PROJECT_supabaseGoogleAuthEnabled: 'false'
      ORG_GRADLE_PROJECT_supabaseAppleAuthEnabled: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require complete Staging client configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          for setting in revenuecatAndroidApiKey supabaseUrl supabasePublishableKey evidriloApiBaseUrl; do
            key="ORG_GRADLE_PROJECT_$setting"
            if [[ -z "${!key:-}" ]]; then
              printf 'Missing Staging build setting: %s\n' "$setting" >&2
              exit 1
            fi
          done
          [[ "$ORG_GRADLE_PROJECT_revenuecatAndroidApiKey" == test_* ]]
          [[ "$ORG_GRADLE_PROJECT_supabasePublishableKey" == sb_publishable_* ]]
          [[ "$ORG_GRADLE_PROJECT_supabaseUrl" == https://cdgzbrrrvlrrgpzbgqog.supabase.co ]]
          [[ "$ORG_GRADLE_PROJECT_evidriloApiBaseUrl" == https://* ]]
      - name: Build sandbox Android APK
        run: ./gradlew --no-daemon --no-configuration-cache --max-workers=1 :androidApp:assembleDebug :androidApp:verifyComposeResourcePackaging --quiet
      - name: Save Staging APK
        uses: actions/upload-artifact@v7
        with:
          name: evidrilo-staging-android-${{ github.sha }}
          path: apps/android/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7
